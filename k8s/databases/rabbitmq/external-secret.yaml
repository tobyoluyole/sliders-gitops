apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-external-secret
  namespace: databases
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rabbitmq-k8s-secret
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: rabbitmq-credentials
      property: username
  - secretKey: password
    remoteRef:
      key: rabbitmq-credentials
      property: password