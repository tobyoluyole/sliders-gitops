apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: 323708468663.dkr.ecr.eu-west-1.amazonaws.com/api-gateway:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: api-gateway-k8s-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi