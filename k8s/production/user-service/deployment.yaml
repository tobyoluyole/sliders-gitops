apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: 323708468663.dkr.ecr.eu-west-1.amazonaws.com/user-service:latest
        envFrom:
        - secretRef:
            name: user-service-k8s-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi