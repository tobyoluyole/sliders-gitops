apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sliders-databases
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tobyoluyole/sliders-gitops.git
    targetRevision: main
    path: k8s/databases
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
