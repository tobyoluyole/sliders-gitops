apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sliders-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tobyoluyole/sliders-gitops.git
    targetRevision: main
    path: .
    directory:
      recurse: false
      include: '{aws-secret-store.yaml,gp3-storageclass.yaml,monitoring-app.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
